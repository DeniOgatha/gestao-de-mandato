name: Atualizar dados do Meu parlamentar

# Todo dia às 6h (Brasília) baixa das fontes públicas as proposições da Câmara,
# a cota parlamentar da Câmara e do Senado e as notícias de cada parlamentar
# (rotina/atualizar_federal.py) e guarda o resultado no branch "dados".
# Em seguida publica os três ambientes, que embutem esses dados no index.html.
# O branch "dados" guarda só a última versão: cada execução substitui a anterior.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: { group: atualizar-dados, cancel-in-progress: false }

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - name: Execução anterior
        run: |
          mkdir dados
          if git -C site ls-remote --exit-code origin dados >/dev/null; then
            git -C site fetch --depth 1 origin dados
            git -C site --work-tree="$PWD/dados" checkout FETCH_HEAD -- .
          fi
          ls -la dados
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Baixar e gerar
        run: python site/rotina/atualizar_federal.py site/index.html dados
      - name: Guardar no branch dados
        run: |
          cd dados
          git init -q -b dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add camara.b64 federal.b64 status.json
          git commit -q -m "Dados de $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados
      - name: Publicar os ambientes
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run publicar.yml --repo ${{ github.repository }} --ref main
